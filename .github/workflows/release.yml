name: Release

on:
  push:
    tags:
      # Plain semver. Platform is an artifact of a release, never part of its
      # version: the updater compares versions as semver, where a `-linux.<n>`
      # suffix sorts below the bare version it names.
      - 'v[0-9]+.[0-9]+.[0-9]+'

  # latest.json is written once the human publishes the draft, because it
  # carries the release notes and those are hand-written after the build.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      # First, so a tree whose version disagrees with the tag costs a second
      # rather than a ~10 minute build and an upload.
      - name: Check the tag matches the configured version
        run: bash scripts/check-version.sh "${GITHUB_REF#refs/tags/v}"

      - uses: ./.github/actions/linux-build-deps

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # tag=v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # tag=v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # branch=master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # tag=v2.9.1
        with:
          workspaces: src-tauri

      - name: Cache the Tesseract model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag=v6.1.0
        with:
          path: src-tauri/tessdata
          key: tessdata-${{ hashFiles('scripts/fetch-tessdata.sh') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # NO_STRIP=true is needed only for the AppImage: linuxdeploy bundles an
      # old `strip` that cannot read the `.relr.dyn` sections modern
      # distributions emit, and it aborts the bundle rather than skipping the
      # library.
      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: NO_STRIP=true pnpm tauri build --bundles deb,rpm,appimage

      # linuxdeploy leaves the AppImage's root .desktop and .DirIcon as
      # symlinks that launcher-integration tools cannot read, so the repack
      # materializes them.
      - name: Materialize the AppImage root metadata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends squashfs-tools zsync
          bash scripts/fix-appimage.sh src-tauri/target/release/bundle/appimage/*.AppImage

      # The AppImage embeds gh-releases-zsync update information (see
      # fix-appimage.sh), which updaters resolve against this index. The URL
      # inside the index is just the filename: the updater fetches it relative
      # to wherever it found the .zsync, i.e. the same release.
      - name: Make the AppImage zsync index
        run: |
          cd src-tauri/target/release/bundle/appimage
          appimage=$(basename ./*.AppImage)
          zsyncmake -u "$appimage" "$appimage"

      # The updater downloads the AppImage itself, so its signature has to
      # cover the repacked bytes, not the ones the bundler signed.
      - name: Re-sign the repacked AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri signer sign src-tauri/target/release/bundle/appimage/*.AppImage

      # Release notes are written by hand rather than generated from commits.
      # Every release has to state the upstream release it is based on, what was
      # verified and on which distro, session type and compositor. None of that
      # is derivable from the tree, which is also why the release is drafted
      # rather than published.
      - name: Draft the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # tag=v3.0.2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.zsync
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  windows:
    if: github.event_name == 'push'
    # The release action can only add to a draft it can already see, so run
    # after Linux rather than racing it to create one for the same tag.
    needs: linux
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Check the tag matches the configured version
        shell: bash
        run: bash scripts/check-version.sh "${GITHUB_REF#refs/tags/v}"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # tag=v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # tag=v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install rust stable
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # branch=master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # tag=v2.9.1
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # One Windows installer, because the manifest names one artifact per
      # platform and a second would only be a coin toss.
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Add to the drafted release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # tag=v3.0.2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  manifest:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1

      - name: Build and attach latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}
        run: |
          mkdir -p tmp/manifest
          gh release download "$TAG" --dir tmp/manifest --pattern '*.sig'
          printf '%s' "$NOTES" > tmp/manifest/notes.txt
          bash scripts/make-updater-manifest.sh \
            "$TAG" tmp/manifest tmp/manifest/notes.txt "$BASE_URL" > tmp/latest.json
          cat tmp/latest.json
          gh release upload "$TAG" tmp/latest.json --clobber
