[package]
name = "warframe-companion"
version = "4.0.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "warframe_companion_lib"
# Tauri's template adds staticlib and cdylib for the mobile runtimes; each is
# another full link per build.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt", "time", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ureq = { version = "3", features = ["json"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
lzma-rs = "0.3"
memchr = "2"
libc = "0.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2"

# Incremental codegen units follow modules, and lib.rs is one 10k-line module:
# an edit anywhere in it rebuilds in 16 s at opt-level 1, 4 s at 0. Deps stay
# at 1 so scans and OCR remain usable in dev.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# 8 % less compile CPU than the default 3; nothing here is profiled to need 3.
[profile.release]
opt-level = 2

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
# async-io rather than tokio: the blocking API is called from inside
# spawn_blocking, and async-io drives its own executor instead of needing a
# tokio reactor in scope. crypto-rust keeps libsecret and OpenSSL out of the
# AppImage, which has already cost us one bundled-library bug.
secret-service = { version = "5.1.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
tesseract = "0.15.2"
xcb = "1.7"
